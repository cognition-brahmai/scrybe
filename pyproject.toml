[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrybe-api"
version = "0.1.0"
description = "Python-first URL-to-structured-data ingestion API with optional OCR and LLM enrichment."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "aiosqlite>=0.20.0",
  "anyio>=4.4.0",
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "langdetect>=1.0.9",
  "lxml>=5.2.2",
  "markdownify>=0.13.1",
  "openai>=1.30.0",
  "pillow>=10.3.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "pymupdf>=1.24.4",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.2",
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "pygments>=2.18.0",
  "python-multipart>=0.0.9",
  "typer>=0.12.3",
  "uvicorn[standard]>=0.30.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "respx>=0.21.1"
]
browser = [
  "playwright>=1.45.0"
]
epub = [
  "ebooklib>=0.18"
]
audio = [
  "faster-whisper>=1.0.3",
  "youtube-transcript-api>=0.6.2",
  "yt-dlp>=2024.5.27"
]

[project.scripts]
scrybe-api = "scrybe_api.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
